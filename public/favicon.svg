<!--
  eListening.uz nishoni — MANBA fayl.

  Ataylab navbar'dagi logotipning aynan o'zi (`components/Layout.tsx`):
  yashil gradient (135°, #10B981 -> #059669) ustida oq naushnik.
  Oldingi fayl binafsha chaqmoq edi — u shablondan qolgan va brendga
  aloqasi yo'q edi.

  Kichik o'lchamga moslangan: quloqchalar CHIZIQ emas, TO'LDIRILGAN —
  16x16 da chiziqli to'rtburchaklar bir piksel bo'lib yo'qolib ketardi.

  PNG/ICO variantlari shu fayldan yasalgan (`index.html` ga qarang).
  O'zgartirsangiz, ularni ham qayta yasang.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Bosh kamari -->
  <path d="M8 17.5V16a8 8 0 0 1 16 0v1.5"
        fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <!-- Quloqchalar -->
  <rect x="5.25" y="16.5" width="5.5" height="9" rx="2.75" fill="#fff"/>
  <rect x="21.25" y="16.5" width="5.5" height="9" rx="2.75" fill="#fff"/>
</svg>
