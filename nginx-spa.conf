server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashli fayllar uzoq keshlanadi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html KESHLANMASIN (har safar serverdan tekshiriladi). Aks holda
    # brauzer eski index.html ni soatlab ushlab turadi va u ESKI hashli
    # bundle'ni yuklaydi — deploy'dan keyin ham eski kod ishlayveradi.
    # 2026-10 da aynan shunday bo'ldi: tuzatilgan build chiqqach ham
    # foydalanuvchida API eski lokal IP'ga ketaverdi.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA — barcha yo'llar index.html ga tushadi (React Router hal qiladi).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
